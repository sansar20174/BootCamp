<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transition</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: background-color 5s ease;
            transition-property: all;
        }

        .box:hover {
            background-color: blue;
            width: 200px;
            height: 200px;
            color: green;
        }
    </style>
        
</head>
<body>
    <div class="box">
    </div>

</body>
</html>
