<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        p{
            color: red;
        }
        *{
            background-color: teal;
        }

    </style>
</head>
<body>
    <p id="para" class="head" style="color: bisque;">Hello from paragraph</p>
</body>
</html>
