    <title>Async / Await</title>

</body>

<script>
    // Async / Await

    // The Async is a keyword that is used to declare a function as asynchronous.
    // The Await is a keyword that is used to wait for a promise to resolve.

    const apiUrl = "https://jsonplaceholder.typicode.com/todos";

    data();
    async function data() {
        try {
            const response = await fetch(apiUrl);
            const res = await response.json();
            console.log(res);
        } catch (error) {
            console.log(error);
        }
    }
</script>
