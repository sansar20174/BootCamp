<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="">
        <input type="text" id="em" placeholder="Enter Email">
        <input type="text" id="pp" placeholder="Enter Password">
        <input type="submit">
        <!-- <button onclick="getdata()>" -->

    </form>

</body>
</html>

<script>
    document.querySelector("form")
    addEventListener("Submit", getdata)
    function getdata(e){
        e.preventDefault()
        const em = document.querySelector("#em").value;
        const pp = document.querySelector("#pp").value;

        console.log(em, pp);
    }
</script>

<!-- 
1. Wrap all input tag inside form tag
2. use type=submit for creating button
3. always apply submit -->
