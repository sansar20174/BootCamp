<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        .container>h1{
            font-size: 1rem;
            border: 1px dotted blue;
        }         
        .container1>h1{
            font-size: 1rem;
        
            padding: 20px;
        }   
    </style>
</head>
<body>
    <div class="container"> 
    <h1>Hello, World!</h1>
    </div>
    
    <div class="container1"> 
        <h1>Hello, World!</h1>
    </div>
</body>
</html>
