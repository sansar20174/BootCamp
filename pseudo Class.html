<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        button:hover {
            background-color: red;
        }
        button:active {
            background-color: yellow;
        }

        input:focus {
            border: 2px solid blue;
            background-color: lightblue;
        }

        input:checked+label {   
            color: green;
        }

        input:disabled {
            background-color: cyan;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    <input type="text" id="">
    <input type="checkbox" name="" id="ip">
    <label for="">Change color into green</label>"
    <input type="text" id="" disabled>
</body>
</html>
